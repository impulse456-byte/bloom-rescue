function modalWrap(body,wide=false){return `<div class="modal-backdrop" data-act="close-backdrop"><div class="modal-panel ${wide?'modal-wide':''}" role="dialog" aria-modal="true" onclick="event.stopPropagation()">${body}</div></div>`}
function modalTitle(eyebrow,title,desc,close=true){return `<div class="modal-head"><div><span class="kicker">${eyebrow}</span><h2>${title}</h2><p>${desc}</p></div>${close?'<button class="modal-close" data-act="close" aria-label="Close">×</button>':''}</div>`}
function modalHtml(){if(!modal)return '';if(modal==='setup'||modal==='settings'){let isSetup=modal==='setup';let body=`${modalTitle(isSetup?'WELCOME TO TABLEWISE':'YOUR PREFERENCES',isSetup?'Let’s make dinner easier.':'Make it yours.',isSetup?'These are your starting settings. Change any of them now or anytime later.':'All of these can be changed whenever you need.',!isSetup)}<form id="prefs-form"><div class="form-grid"><label>ZIP code <input name="zip" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" value="${esc(S.zip)}" required/></label><label>People to feed <select name="people">${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${S.people===n?'selected':''}>${n} ${n===1?'person':'people'}</option>`).join('')}</select></label><label>Weekly dinner budget <div class="money-input"><span>$</span><input name="budget" type="number" min="1" max="99999" step="1" value="${S.budget}" required/></div></label><label>Dinners per week <select name="days">${[3,4,5,6,7].map(n=>`<option value="${n}" ${S.days===n?'selected':''}>${n} dinners</option>`).join('')}</select></label></div><div class="form-subhead">YOUR STORES <small>Choose at least one</small></div><div class="check-pill-row">${STORES.map(x=>`<label class="store-check"><input type="checkbox" name="stores" value="${x}" ${S.stores.includes(x)?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="form-subhead">YOUR DINNER STYLE</div><div class="style-row">${[['balanced','Balanced variety'],['quick','Mostly 30-minute meals'],['budget','Keep it economical']].map(([k,n])=>`<label class="style-check"><input type="radio" name="style" value="${k}" ${S.style===k?'checked':''}><span>${n}</span></label>`).join('')}</div><p id="form-error" class="form-error" aria-live="polite"></p><button type="submit" class="btn btn-primary full big">${isSetup?'Make my meal plan':'Save preferences'} &nbsp; →</button>${isSetup?'<button type="button" class="btn btn-soft full" data-act="skip-setup" style="margin-top:9px">Skip for now — try the demo</button>':''}<p class="form-note">Your settings are stored locally in this browser. No account required.</p></form>`;return modalWrap(body,true)}
if(modal==='pantry'){return modalWrap(`${modalTitle('ONE QUICK CHECK','What’s already in your kitchen?','Tap the spices or pantry staples you already have, so you don’t buy duplicates.',false)}<div class="quick-pantry">${PANTRY_KEYS.map(k=>`<button data-act="toggle-pantry" data-key="${k}" class="quick-pantry-chip ${S.pantry[k]?'has':''}"><span>${S.pantry[k]?'✓':'＋'}</span> ${esc(def(k)[0])}</button>`).join('')}</div><div class="modal-footer"><button class="btn btn-soft" data-act="finish-pantry">Skip for now</button><button class="btn btn-primary" data-act="finish-pantry">Done checking &nbsp; →</button></div>`,true)}
if(modal==='detail'){let r=recipe(activeProduct);if(!r)return '';return modalWrap(`<div class="detail-banner ${r.shade}"><span>${r.emoji}</span><button class="modal-close over-art" data-act="close">×</button></div><div class="detail-inner">${modalTitle(r.source,r.title,`${r.time} min · ${r.servings} original servings · ${r.category}`,false)}<div class="detail-callout">Shopping quantities are approximate for planning. Follow the original recipe for exact amounts and cooking directions.</div><div class="detail-ingredients"><strong>Ingredients in the plan</strong>${Object.entries(r.ings).map(([k,q])=>`<div><span>${esc(def(k)[0])}</span><span>${q<.2?'Pantry amount':qtyString(Math.round(q*10)/10,k)}</span></div>`).join('')}</div><div class="modal-footer"><a class="btn btn-soft" target="_blank" rel="noopener noreferrer" href="${esc(r.url)}">Read original recipe ↗</a><button class="btn btn-primary" data-act="choose-meal" data-id="${r.id}">Add to my week +</button></div></div>`,true)}
if(modal==='swap'){return modalWrap(`${modalTitle('CHANGE YOUR MENU',`Choose ${DAYS[swapIndex]}’s dinner`,'Pick something that sounds good. Your shopping list will recalculate automatically.') }<div class="swap-list">${RECIPES.map(r=>`<button data-act="apply-swap" data-id="${r.id}" class="swap-row ${S.meals[swapIndex]===r.id?'is-current':''}"><span class="swap-emoji ${r.shade}">${r.emoji}</span><span><b>${esc(r.title)}</b><small>${esc(r.source)} · ${r.time} min</small></span><span class="swap-arrow">${S.meals[swapIndex]===r.id?'✓':'→'}</span></button>`).join('')}</div>`,true)}
if(modal==='price'){let k=activeProduct,d=def(k);return modalWrap(`${modalTitle('EDIT ESTIMATED PRICES',`Price check: ${esc(d[0])}`,'Enter a shelf price for the shown purchase unit. Edits are saved on this device.')}<div class="unit-banner">Purchase unit: <b>${esc(d[2])}</b>. Unedited values are simulated examples.</div><form id="price-form"><div class="price-form-fields">${S.stores.map(st=>`<label><span>${st} ${S.prices[k]?.[st]!=null?'<em>your price</em>':'<em>sample estimate</em>'}</span><div class="money-input"><span>$</span><input name="${st}" type="number" required step="0.01" min="0" max="9999" value="${estimatedUnit(k,st).toFixed(2)}"/></div></label>`).join('')}</div><button class="btn btn-primary full" type="submit">Save prices</button></form>`,false)}
if(modal==='add'){return modalWrap(`${modalTitle('A LITTLE EXTRA','Add a grocery item','Need a snack or something else for dinner? Add it to this week’s list.')}<form id="extra-form" class="extra-form"><label>Item name<input name="name" required maxlength="70" placeholder="e.g. Fresh lemons"/></label><div class="form-grid"><label>Quantity<input type="number" min="1" max="99" step="1" name="qty" value="1" required/></label><label>Sample price per item ($)<input type="number" name="price" min="0" max="999" step="0.01" value="3.00" required/></label></div><button class="btn btn-primary full" type="submit">Add to shopping list</button></form>`,false)}
return ''}
function notify(msg){let e=$('#toast');if(!e)return;e.textContent=msg;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),2800)}
function render(){document.getElementById('app').innerHTML=shell();if(view==='recipes')filterRecipes()}
function filterRecipes(){document.querySelectorAll('.recipe-tile').forEach(el=>{el.hidden=!!((activeCategory!=='All'&&el.dataset.cat!==activeCategory)||!el.dataset.search.includes(searchTerm.toLowerCase()))})}
function openModal(type,key){modal=type;activeProduct=key||'';render();setTimeout(()=>{$('.modal-panel input:not([type="checkbox"]):not([type="radio"])')?.focus?.()},30)}
function setupSubmit(form){const fd=new FormData(form),stores=fd.getAll('stores');if(!stores.length){const e=$('#form-error');if(e)e.textContent='Please select at least one store.';return;}S.zip=String(fd.get('zip'));S.people=Number(fd.get('people'));S.budget=Number(fd.get('budget'));S.days=Number(fd.get('days'));S.stores=stores;S.style=String(fd.get('style')||'balanced');let first=!S.setup;S.setup=true;S.meals=S.meals.slice(0,S.days);while(S.meals.length<S.days)S.meals.push(RECIPES[S.meals.length%RECIPES.length].id);modal=first&&!S.pantryAsked?'pantry':'';save();render();notify(first?'Welcome to Tablewise!':'Preferences saved')}
function regenerate(){const used=new Set(), chosen=[],pool=RECIPES.filter(r=>S.style==='quick'?r.time<=45:true);let categories=['Chicken','Vegetarian','Beef','Seafood'];for(let i=0;i<S.days;i++){let choices=pool.filter(r=>!used.has(r.id));if(S.style==='budget'){choices.sort((a,b)=>mealPreview(a)-mealPreview(b)+Math.random()*.5-.25)}else{choices=choices.sort(()=>Math.random()-.5);if(i<3){const type=categories[[0,1,2][i]];choices=choices.sort((a,b)=>(a.category===type?-1:0)-(b.category===type?-1:0));}}let pick=choices[0];if(pick){used.add(pick.id);chosen.push(pick.id)}}S.meals=chosen;S.checked={};save();render();notify('A fresh dinner lineup is ready')}
function mealPreview(r){let sum=0;Object.entries(r.ings).forEach(([k,q])=>{if(S.pantry[k])return;const n=q*S.people/r.servings;sum+=Math.ceil(n)*estimatedUnit(k,S.stores[0]||'Meijer')});return sum}
function exportList(){const sum=summary(), which=S.strategy==='split'?'Split-store demonstration':`One-store demonstration (${sum.best})`;let lines=[`TABLEWISE · DINNER SHOPPING LIST`,`ZIP ${S.zip} | ${S.people} people | ${S.days} dinners`,`Budget: ${money(S.budget)} | ${which} | Estimated: ${money((S.strategy==='split'||S.strategy==='both')?sum.split:sum.one)}`,`IMPORTANT: All unedited prices are demo estimates, not verified local prices.`,``,`YOUR DINNERS`,...S.meals.slice(0,S.days).map((id,i)=>`${DAYS[i]}: ${recipe(id)?.title||'Open'}`),'','GROCERIES'];let category='';sum.items.forEach(i=>{if(i.aisle!==category){category=i.aisle;lines.push('',category.toUpperCase())}lines.push(`${S.checked[i.key]?'[x]':'[ ]'} ${i.name} — ${qtyString(i.count,i.key)} — sample ${money(estimatedUnit(i.key,sum.best)*i.count)}`)});lines.push('','Original recipes:');S.meals.slice(0,S.days).forEach(id=>{let r=recipe(id);if(r)lines.push(`${r.title}: ${r.url}`)});const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tablewise-shopping-list.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('Shopping list exported')}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const action=btn.dataset.act, id=btn.dataset.id, key=btn.dataset.key; if(action==='view'){view=id;searchTerm='';render();window.scrollTo(0,0)} else if(action==='settings')openModal('settings');else if(action==='skip-setup'){S.setup=true;modal=!S.pantryAsked?'pantry':'';save();render()}else if(action==='ad-filter'){adFilter=id;render()}else if(action==='ad-add'){let d=activeDeals().find(d=>d.id===id);if(d){S.extra.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name:d.name+' ('+d.store+' ad)',qty:1,price:d.price});save();view='shop';render();notify('Added ad offer. Confirm package quantity and store price before shopping.')}} else if(action==='generate')regenerate();else if(action==='shop-now'){view='shop';modal='';render();window.scrollTo(0,0)} else if(action==='pantry-check')openModal('pantry');else if(action==='pantry-none'){S.pantry={};save();render();notify('Pantry selections cleared')}else if(action==='toggle-pantry'){S.pantry[key]=!S.pantry[key];save();render()}else if(action==='finish-pantry'){S.pantryAsked=true;modal='';save();render();notify('Pantry checked. Your shopping list is updated.')} else if(action==='swap'){swapIndex=Number(btn.dataset.idx);openModal('swap')} else if(action==='apply-swap'){S.meals[swapIndex]=id;S.checked={};save();modal='';render();notify(`${DAYS[swapIndex]} dinner updated`)}else if(action==='detail')openModal('detail',id);else if(action==='choose-meal'){let pos=S.meals.findIndex((r,i)=>i<S.days&&!r);if(pos===-1){pos=S.meals.findIndex((r,i)=>i<S.days&&r===id);if(pos===-1)pos=S.days-1}S.meals[pos]=id;S.checked={};modal='';view='plan';save();render();notify(`${recipe(id)?.title||'Dinner'} added for ${DAYS[pos]}`)}else if(action==='category'){activeCategory=id;render()}else if(action==='check-item'){S.checked[key]=btn.checked;save();const count=listItems().filter(i=>S.checked[i.key]).length;const p=$('.shop-topline p');if(p)p.textContent=`${count} of ${listItems().length} items checked · ${summary().used} pantry items removed`;btn.closest('.shop-item')?.classList.toggle('bought',btn.checked)}else if(action==='strategy'){S.strategy=id;save();render()}else if(action==='price')openModal('price',key);else if(action==='add-item')openModal('add');else if(action==='clear-checks'){S.checked={};save();render();notify('Shopping checks cleared')}else if(action==='export')exportList();else if(action==='print'){window.print()}else if(action==='close'||action==='close-backdrop'){modal='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){searchTerm=e.target.value;filterRecipes()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='prefs-form')setupSubmit(e.target);else if(e.target.id==='price-form'){const fd=new FormData(e.target);S.prices[activeProduct]=S.prices[activeProduct]||{};S.stores.forEach(s=>S.prices[activeProduct][s]=Math.max(0,Number(fd.get(s))||0));modal='';save();render();notify('Your store prices were saved')}else if(e.target.id==='extra-form'){let fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;S.extra.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name,qty:Math.max(1,Number(fd.get('qty'))||1),price:Math.max(0,Number(fd.get('price'))||0)});modal='';save();render();view='shop';render();notify('Added to your grocery list')}});
render();

</script></body></html>
