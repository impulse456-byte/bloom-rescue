.dish-photo{display:block;position:absolute;inset:0;overflow:hidden;background:#e8e8de}
.dish-photo img,.dish-photo .dish-sprite,.dish-emoji-fallback{display:block;width:100%;height:100%;position:absolute;inset:0}
.dish-photo img{object-fit:cover;object-position:center 48%;transition:transform .38s ease}
.dish-sprite{background-image:var(--dish-sprite);background-size:400% 400%;background-position:var(--dish-x) var(--dish-y);background-repeat:no-repeat;transition:transform .38s ease}
.dish-emoji-fallback{display:grid;place-items:center;font-size:55px;background:#e6e9d9}
.dish-emoji-fallback[hidden]{display:none!important}
.recipe-tile:hover .dish-photo img,.recipe-tile:hover .dish-sprite,.meal-card:hover .dish-photo img,.meal-card:hover .dish-sprite{transform:scale(1.045)}
.recipe-art.with-photo{display:block;position:relative;width:100%;border:0;padding:0;cursor:pointer;overflow:hidden}
.recipe-art .recipe-tag{z-index:2;white-space:nowrap;box-shadow:0 2px 8px #0001}
.recipe-tile{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.recipe-tile:hover{transform:translateY(-2px);box-shadow:0 11px 26px #24372917}
.recipe-save{position:absolute;z-index:3;right:12px;top:11px;border:1px solid #ffffffad;background:#fffffff2;color:#527554;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px #0003}
.recipe-save.saved{background:#fdf2ee;color:#cc6656}
.recipe-count{font-size:12px;color:#718272;margin:10px 0 16px;font-weight:800}
.meal-art.with-photo{width:100%;position:relative;display:block;cursor:pointer;overflow:hidden;border:0;padding:0}
.meal-art.with-photo .art-corner{z-index:2;position:absolute}
.detail-photo-banner{height:225px!important;display:block!important;overflow:hidden}
.detail-photo-banner .detail-photo img,.detail-photo-banner .detail-photo .dish-sprite{object-position:center 48%}
.detail-photo-banner .over-art{z-index:4;background:#ffffffdd}
.swap-emoji{position:relative;overflow:hidden;flex-shrink:0}
.swap-photo img,.swap-photo .dish-sprite{border-radius:8px}
@media(max-width:560px){.recipe-save{right:7px;top:7px;width:29px;height:29px}.recipe-count{margin:7px 0 12px}.detail-photo-banner{height:170px!important}}

/* Single-store cart clarity and touch-friendly selection */
.single-store-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 12px;color:var(--forest);font-size:13px;font-weight:800}.single-store-picker select{background:#fff;color:var(--ink);border:1px solid #cad8c9;border-radius:10px;padding:12px 14px;max-width:100%;min-height:44px}.shopping-mode-note{color:#396447!important;font-weight:700!important;margin-top:6px!important}.item-store{color:#2e6146;font-weight:800}
@media(max-width:560px){.single-store-picker{align-items:stretch;flex-direction:column}.single-store-picker select{width:100%}}

/* v0.4: week-specific accessible pantry controls and responsive modal layout */
.pantry-week-summary{background:#eef6ea;border:1px solid #d8e6d4;color:#467357;padding:13px 15px;border-radius:11px;font-size:13px;line-height:1.5;margin:0 0 16px}
.pantry-week-summary b{color:#24633c}.pantry-week-summary span{color:#697e70}
.pantry-aisle{margin-bottom:17px}.pantry-aisle h3{font-size:12px;letter-spacing:.015em;color:#53715b;margin:0 0 9px}
.weekly-pantry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 7px}
.weekly-pantry-chip,.quick-pantry-chip{appearance:none;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid #dce7d9;background:white;border-radius:10px;padding:10px 11px;min-height:56px;color:#415c48;white-space:normal}
.weekly-pantry-chip.has,.quick-pantry-chip.has{background:#e4f5e4;border-color:#6ea880;color:#235d39;box-shadow:inset 0 0 0 1px #a1c6a7}
.weekly-pantry-chip:focus-visible,.quick-pantry-chip:focus-visible,.pantry-card:focus-visible{outline:3px solid #3a9269;outline-offset:2px}
.pantry-choice-icon{flex:0 0 23px;width:23px;height:23px;display:grid;place-items:center;font-weight:900;font-size:13px;border:1px solid #b9cbb9;border-radius:6px;background:#f8fbf7}
.has .pantry-choice-icon{background:#397c54;border-color:#397c54;color:#fff}
.pantry-choice-text{display:flex;flex-direction:column;gap:3px;min-width:0;line-height:1.4}
.pantry-choice-text strong{font-size:12px}.pantry-choice-text small{font-size:10px;line-height:1.3;color:#819087;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:225px}
.pantry-scroll-region{max-height:min(60vh,525px);overflow:auto;overscroll-behavior:contain;padding-right:5px;margin-bottom:12px}
.pantry-sticky-footer{position:sticky;bottom:-27px;background:white;border-top:1px solid #e1e9df;padding:14px 0 0;z-index:2}
.extra-pantry-details{border-top:1px solid #dbe6d9;margin:13px 0}.extra-pantry-details summary{padding:14px 0;cursor:pointer;color:#427457;font-size:12px;font-weight:800}
.extra-pantry-details .quick-pantry{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:5px}

}</div><p id="form-error" class="form-error" aria-live="polite"></p><button type="submit" class="btn btn-primary full big">${isSetup?'Make my meal plan':'Save preferences'} &nbsp; →</button>${isSetup?'<button type="button" class="btn btn-soft full" data-act="skip-setup" style="margin-top:9px">Skip for now — try the demo</button>':''}<p class="form-note">Your settings are stored locally in this browser. No account required.</p></form>`;return modalWrap(body,true)}

function notify(msg){let e=$('#toast');if(!e)return;e.textContent=msg;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),2800)}
function render(options={}){
 const old=document.querySelector('.modal-panel');
 const oldScroll=options.preserveModalScroll&&old?old.scrollTop:0;
 const innerScroll=options.preserveModalScroll?document.querySelector('.pantry-scroll-region')?.scrollTop:0;
 const detailsOpen=options.preserveModalScroll?!!document.querySelector('.extra-pantry-details[open]'):false;
 document.getElementById('app').innerHTML=shell();
 if(options.preserveModalScroll){
  const panel=document.querySelector('.modal-panel'),inner=document.querySelector('.pantry-scroll-region');
  if(panel)panel.scrollTop=oldScroll;
  if(inner)inner.scrollTop=innerScroll;
  if(detailsOpen)document.querySelector('.extra-pantry-details')?.setAttribute('open','');
 }
 if(view==='recipes')filterRecipes();
}
function filterRecipes(){let shown=0;document.querySelectorAll('.recipe-tile').forEach(el=>{el.hidden=!!((activeCategory==='Quick'&&Number(el.dataset.time)>30)||(activeCategory==='Favorites'&&el.dataset.fav!=='1')||(!['All','Quick','Favorites'].includes(activeCategory)&&el.dataset.cat!==activeCategory)||!el.dataset.search.includes(searchTerm.toLowerCase()));if(!el.hidden)shown++});const count=$('#recipe-count');if(count)count.textContent=`${shown} ${shown===1?'recipe':'recipes'} to explore${activeCategory==='Favorites'&&shown===0?' · Tap the heart on a recipe to save it':''}`}
function openModal(type,key){modal=type;activeProduct=key||'';render();setTimeout(()=>{$('.modal-panel input:not([type="checkbox"]):not([type="radio"])')?.focus?.()},30)}
function setupSubmit(form){const fd=new FormData(form),stores=fd.getAll('stores');if(!stores.length){const e=$('#form-error');if(e)e.textContent='Please select at least one store.';return;}S.zip=String(fd.get('zip'));S.people=Number(fd.get('people'));S.budget=Number(fd.get('budget'));S.estimateBuffer=Math.max(0,Math.min(20,Number(fd.get('estimateBuffer'))||0));S.days=Number(fd.get('days'));S.stores=stores;S.style=String(fd.get('style')||'balanced');let first=!S.setup;S.setup=true;S.meals=S.meals.slice(0,S.days);while(S.meals.length<S.days)S.meals.push(RECIPES[S.meals.length%RECIPES.length].id);modal=first&&!S.pantryAsked?'pantry':'';save();render();notify(first?'Welcome to Tablewise!':'Preferences saved')}
function regenerate(){const used=new Set(), chosen=[],pool=RECIPES.filter(r=>S.style==='quick'?r.time<=45:true);let categories=['Chicken','Vegetarian','Beef','Seafood'];for(let i=0;i<S.days;i++){let choices=pool.filter(r=>!used.has(r.id));if(S.style==='budget'){choices.sort((a,b)=>mealPreview(a)-mealPreview(b)+Math.random()*.5-.25)}else{choices=choices.sort(()=>Math.random()-.5);if(i<3){const type=categories[[0,1,2][i]];choices=choices.sort((a,b)=>(a.category===type?-1:0)-(b.category===type?-1:0));}}let pick=choices[0];if(pick){used.add(pick.id);chosen.push(pick.id)}}S.meals=chosen;S.mealMultipliers={};S.checked={};save();render();notify('A fresh dinner lineup is ready')}
function mealPreview(r){let sum=0;Object.entries(r.ings).forEach(([k,q])=>{if(S.pantry[k])return;const n=q*S.people/r.servings;sum+=Math.ceil(n)*estimatedUnit(k,S.stores[0]||'Meijer')});return sum}
function exportList(){
 const sum=summary(),split=isSplitMode(),chosen=selectedSingleStore(sum),which=split?'Split-store demonstration':`One-store demonstration (${chosen})`,total=activeTotal(sum);
 let lines=[`TABLEWISE · DINNER SHOPPING LIST`,`ZIP ${S.zip} | ${S.people} people | ${S.days} dinners`,`Budget: ${money(S.budget)} | ${which} | Estimated: ${money(total)}`,`IMPORTANT: Sample estimates include a +${estimateCushion()}% cushion. Independently reported ALDI ad offers are unverified locally. Manually entered prices are never buffered.`,``,`YOUR DINNERS`,...S.meals.slice(0,S.days).map((id,i)=>`${DAYS[i]}: ${recipe(id)?.title||'Open'}`),'','GROCERIES'];
 let category='';sum.items.forEach(i=>{if(i.aisle!==category){category=i.aisle;lines.push('',category.toUpperCase())}const st=itemStore(i,sum);lines.push(`${S.checked[i.key]?'[x]':'[ ]'} ${i.name} — ${qtyString(i.count,i.key)} — ${st} — ${money(estimatedUnit(i.key,st)*i.count)}`);(i.allocations||[]).forEach(a=>lines.push(`    ${a.day}: ${a.title} — ${shoppingQuantity(a.needed,i.key)} (${a.multiplier}× recipe)`))});
 lines.push('','Original recipes:');S.meals.slice(0,S.days).forEach(id=>{let r=recipe(id);if(r)lines.push(`${r.title}: ${r.url}`)});
 const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tablewise-shopping-list.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);notify('Shopping list exported')
}

document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn)return;const action=btn.dataset.act, id=btn.dataset.id, key=btn.dataset.key; if(action==='close-backdrop'&&e.target!==btn)return; if(action==='view'){view=id;searchTerm='';render();window.scrollTo(0,0)} else if(action==='settings')openModal('settings');else if(action==='skip-setup'){S.setup=true;modal=!S.pantryAsked?'pantry':'';save();render()}else if(action==='ad-filter'){adFilter=id;render()}else if(action==='ad-add'){let d=activeDeals().find(d=>d.id===id);if(d){S.extra.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name:d.name+' ('+d.store+' ad)',qty:1,price:d.price});save();view='shop';render();notify('Added ad offer. Confirm package quantity and store price before shopping.')}} else if(action==='shop-recipe-breakdown'){if(expandedShopItems.has(key))expandedShopItems.delete(key);else expandedShopItems.add(key);rerenderKeepPosition()}else if(action==='meal-double'){const idx=Number(btn.dataset.idx);if(Number.isInteger(idx)&&idx>=0&&idx<S.days){const current=mealFactor(idx);S.mealMultipliers=S.mealMultipliers||{};S.mealMultipliers[idx]=current===2?1:2;S.checked={};save();rerenderKeepPosition();notify(DAYS[idx]+(current===2?' returned to normal servings':' recipe doubled to '+(S.people*2)+' servings'))}}else if(action==='generate')regenerate();else if(action==='shop-now'){view='shop';modal='';render();window.scrollTo(0,0)} else if(action==='pantry-check')openModal('pantry');else if(action==='pantry-none'){S.pantry={};save();render();notify('Pantry selections cleared')}else if(action==='toggle-pantry'){S.pantry[key]=!S.pantry[key];save();render({preserveModalScroll:modal==='pantry'})}else if(action==='finish-pantry'){S.pantryAsked=true;modal='';save();render();notify('Pantry checked. Your shopping list is updated.')} else if(action==='swap'){swapIndex=Number(btn.dataset.idx);openModal('swap')} else if(action==='apply-swap'){S.meals[swapIndex]=id;S.mealMultipliers[swapIndex]=1;S.checked={};save();modal='';render();notify(`${DAYS[swapIndex]} dinner updated`)}else if(action==='detail')openModal('detail',id);else if(action==='choose-meal'){let pos=S.meals.findIndex((r,i)=>i<S.days&&!r);if(pos===-1){pos=S.meals.findIndex((r,i)=>i<S.days&&r===id);if(pos===-1)pos=S.days-1}S.meals[pos]=id;S.mealMultipliers[pos]=1;S.checked={};modal='';view='plan';save();render();notify(`${recipe(id)?.title||'Dinner'} added for ${DAYS[pos]}`)}else if(action==='category'){activeCategory=id;render()}else if(action==='toggle-favorite'){S.favorites=Array.isArray(S.favorites)?S.favorites:[];S.favorites=S.favorites.includes(id)?S.favorites.filter(x=>x!==id):[...S.favorites,id];save();render();notify(S.favorites.includes(id)?'Saved to your favorite recipes':'Removed from saved recipes')}else if(action==='check-item'){S.checked[key]=btn.checked;save();const count=listItems().filter(i=>S.checked[i.key]).length;const p=$('.shop-topline p');if(p)p.textContent=`${count} of ${listItems().length} items checked · ${summary().used} pantry items removed`;btn.closest('.shop-item')?.classList.toggle('bought',btn.checked)}else if(action==='strategy'){S.strategy=id;save();render()}else if(action==='price')openModal('price',key);else if(action==='add-item')openModal('add');else if(action==='clear-checks'){S.checked={};save();render();notify('Shopping checks cleared')}else if(action==='export')exportList();else if(action==='print'){window.print()}else if(action==='close'||action==='close-backdrop'){modal='';render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){e.preventDefault();modal='';render()}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){searchTerm=e.target.value;filterRecipes()}});
document.addEventListener('change',e=>{if(e.target.id==='kroger-region-select'){S.krogerRegion=e.target.value;save();render()} else if(e.target.id==='single-store-select'){S.singleStore=e.target.value==='auto'?'':e.target.value;save();render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='prefs-form')setupSubmit(e.target);else if(e.target.id==='price-form'){const fd=new FormData(e.target),k=activeProduct;S.prices[k]=S.prices[k]||{};let changes=0;S.stores.forEach(st=>{const input=Number(fd.get(st)),previous=Number(estimatedUnit(k,st).toFixed(2));if(Number.isFinite(input)&&input>=0&&Math.abs(input-previous)>0.001){S.prices[k][st]=Math.round(input*100)/100;changes++}});modal='';save();render();notify(changes?`Updated ${changes} store ${changes===1?'price':'prices'}; the split cart uses the cheapest store for each item`:'No store prices changed')}else if(e.target.id==='extra-form'){let fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;S.extra.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),name,qty:Math.max(1,Number(fd.get('qty'))||1),price:Math.max(0,Number(fd.get('price'))||0)});modal='';save();render();view='shop';render();notify('Added to your grocery list')}});
render();
