name: Tablewise weekly grocery-ad refresh
on:
  schedule:
    # Wednesday morning in Michigan (winter ~8:15 AM; summer ~9:15 AM)
    - cron: '15 13 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python tablewise-beta/refresh_ads.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablewise-beta/index.html tablewise-beta/ads.json tablewise-beta/ads-data.js
          if ! git diff --staged --quiet; then git commit -m 'Refresh Tablewise public weekly-ad feed'; git push; fi