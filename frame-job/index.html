<!doctype html>
<html lang="en">

  <meta name="description" content="FRAME JOB: An original illustrated spot-the-forgery detective game. Find the altered clues and crack the case.">
  <title>FRAME JOB — Forgery Detective</title>
  <style>
    :root{--ink:#101b2b;--navy:#111e30;--navy2:#1a2b40;--line:#36465b;--cream:#f9efd7;--muted:#aebac6;--gold:#edc77f;--gold2:#ffe4ad;--mint:#73e2bb;--rose:#f6a2a3;--shadow:#060d17}
    *{box-sizing:border-box}html{background:var(--ink)}body{margin:0;background:radial-gradient(ellipse 460px 490px at 52% -140px,#38506c 0%,transparent 90%),#101b2b;min-height:100svh;font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;overflow-x:hidden}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{opacity:.42;cursor:default}svg{display:block}
    #app{width:min(100%,675px);min-height:100svh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 17px) 16px calc(env(safe-area-inset-bottom) + 32px);position:relative}
    .mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:12px;color:var(--gold);font-size:25px;transform:rotate(-5deg);box-shadow:inset 0 0 0 3px #bfa16c33}.brand-text strong{font-family:'Space Grotesk',sans-serif;font-size:22px;letter-spacing:-1.5px;line-height:1;display:block}.brand-text small{font-size:8px;letter-spacing:2px;color:var(--muted);font-weight:800;display:block;margin-top:4px}.mast-actions{display:flex;gap:7px}.icon-btn{background:#253448;border:1px solid #52627a;border-radius:12px;color:#f6e9c8;min-width:42px;height:42px;display:grid;place-items:center;font-size:19px;box-shadow:0 3px 0 #050c16}.icon-btn:active,.btn:active,.pill-btn:active{transform:translateY(2px);box-shadow:none}
    .brief{position:relative;background:linear-gradient(125deg,#243b50,#17293d 70%);border:1px solid #405972;border-radius:22px;padding:19px 20px 17px;box-shadow:0 9px 20px #03081250;overflow:hidden}.brief:before{content:'';position:absolute;right:-12px;top:-32px;width:144px;height:144px;border:2px solid #f3cb7830;border-radius:50%;box-shadow:0 0 0 17px #f3cb780c,0 0 0 37px #f3cb7806;pointer-events:none}.overline{color:var(--gold);letter-spacing:2px;font-size:10px;font-weight:800}.brief h1{position:relative;font-family:'Space Grotesk',sans-serif;letter-spacing:-.8px;line-height:1.13;font-size:clamp(22px,5vw,29px);margin:8px 0 7px;font-weight:700;max-width:83%}.brief p{color:#b9c8d0;font-size:12px;margin:0;line-height:1.45;max-width:90%}.brief-bottom{display:flex;align-items:center;gap:11px;margin-top:16px}.track{flex:1;height:7px;background:#0d1b2b;border-radius:6px;overflow:hidden;border:1px solid #465b64}.track>div{height:100%;width:0;background:linear-gradient(90deg,#e7ad66,#f3d997);border-radius:6px;transition:width .3s}.count{font-size:12px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:#192a3d;border:1px solid #34465b;border-radius:14px;padding:11px 12px;min-height:68px}.stat label{font-size:9px;color:#a7b7c5;letter-spacing:1.25px;display:block;font-weight:800;margin-bottom:6px}.stat b{font:700 19px 'Space Grotesk',sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}.stat b small{font-size:10px;color:#acb9c4}.timer-low b{color:var(--rose)}
    .painting-area{padding:9px;background:linear-gradient(120deg,#d8aa63,#fff0bc 14%,#a96d39 35%,#f5ca77 64%,#86532f 86%,#f1c77e);border:2px solid #a86f38;box-shadow:inset 0 0 0 2px #ffe8ad70,0 10px 0 #050b13,0 18px 22px #0007;border-radius:5px;position:relative}.paint-inner{border:5px solid #67452c;box-shadow:inset 0 0 0 2px #d6b575,0 0 0 1px #5c3926;background:#1c3043}.painting{position:relative;width:100%;aspect-ratio:600/420;overflow:hidden;background:#223948;cursor:crosshair;touch-action:manipulation}.painting .art-layer{position:absolute;inset:0}.painting .art-layer svg,.mark-layer{height:100%;width:100%;display:block}.painting .original{opacity:0;transition:opacity .12s;pointer-events:none}.painting.view-original .original{opacity:1}.painting .mark-layer{position:absolute;inset:0;pointer-events:none;overflow:visible}.painting.view-original .mark-layer{opacity:0}.paint-cap{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:15px 3px 12px}.canvas-label{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--gold2)}.canvas-label:before{content:'●';color:var(--rose);font-size:9px;margin-right:8px}.painting.view-original~.paint-cap .canvas-label:before{color:var(--mint)}.caption-note{font-size:10px;color:#a5b4c3}.compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.pill-btn{border:1px solid #536579;border-radius:12px;background:#22354a;color:#e2e6e8;padding:12px 8px;font-weight:800;font-size:11px;letter-spacing:.2px;box-shadow:0 3px 0 #070e19;min-height:45px}.pill-btn.active{background:#f1cf90;border-color:#ffe3ac;color:#2c2930}.pill-btn.soft{background:#31435a}.pill-btn b{font-size:13px}
    .bottom-row{margin-top:14px;display:grid;grid-template-columns:1.23fr 1fr;gap:10px}.btn{min-height:53px;border-radius:14px;border:1px solid #8b6c40;font-size:13px;letter-spacing:.3px;font-weight:800;box-shadow:0 4px 0 #050c16;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px}.btn-primary{background:linear-gradient(180deg,#ffe9b9,#e9bd77);color:#353343;border-color:#ffe2a8}.btn-outline{background:#20354b;color:#eff3f4;border-color:#49627b}.btn .icon{font-size:18px}.below{display:flex;justify-content:center;gap:8px;align-items:center;color:#8e9cad;font-size:10px;letter-spacing:.2px;margin-top:17px;text-align:center}.below .dot{width:4px;height:4px;background:#657a90;border-radius:50%}.gallery-link{background:transparent;border:0;color:#c7dbdc;text-decoration:underline;text-decoration-color:#5a7881;font-size:11px;margin-top:11px;padding:6px}.toast{position:fixed;top:calc(env(safe-area-inset-top) + 76px);left:50%;transform:translate(-50%,-30px);max-width:min(92vw,440px);width:max-content;background:#f6ddb0;color:#152c36;padding:11px 18px;box-shadow:0 8px 25px #0006;border:2px solid #fff0d2;border-radius:16px;font-weight:800;font-size:12px;z-index:60;opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;text-align:center}.toast.visible{opacity:1;transform:translate(-50%,0)}
    .modal-back{position:fixed;z-index:70;inset:0;background:#020913d9;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(9px)}.modal{background:linear-gradient(160deg,#233950,#15283b);border:1px solid #698096;box-shadow:0 20px 50px #0009;border-radius:24px;width:min(100%,500px);max-height:min(90svh,790px);overflow:auto;padding:24px;position:relative}.modal h2{font:700 28px 'Space Grotesk',sans-serif;margin:8px 0;letter-spacing:-.9px}.modal p{font-size:13px;color:#b9c8d0;line-height:1.56;margin:9px 0 14px}.modal .primary-full{width:100%;margin-top:10px}.modal .second{display:block;background:transparent;color:#c7d2d5;font-weight:800;text-align:center;border:0;width:100%;padding:12px}.close{position:absolute;top:12px;right:12px;color:#f8ead0;border:0;background:#31485d;border-radius:11px;font-size:20px;height:35px;width:35px;display:grid;place-items:center}.badge-line{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.mini-badge{border-radius:11px;background:#2b4358;border:1px solid #4f6a78;color:#f8e2b9;padding:9px 12px;font-size:11px;font-weight:800}.proof{font-size:60px;text-align:center;margin:8px auto 0;line-height:1.4;filter:drop-shadow(0 5px 5px #0004)}.stars{font-size:37px;letter-spacing:6px;color:#f9d488;text-align:center;margin:2px 0 8px}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.summary-grid div{text-align:center;background:#132437;border-radius:12px;padding:11px 4px}.summary-grid strong{font:700 22px 'Space Grotesk';display:block;color:#ffe2ac}.summary-grid small{display:block;font-size:9px;color:#aabac6;letter-spacing:.5px}.case-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.case-card{background:#20354a;border:1px solid #3b566c;color:#f0e8d6;border-radius:14px;text-align:left;padding:12px;position:relative;min-height:107px}.case-card.selected{border-color:#edc77f}.case-card:disabled{opacity:.37}.case-card .num{font-size:10px;color:#e6c891;letter-spacing:1px;font-weight:800}.case-card strong{display:block;font-size:14px;margin:6px 0}.case-card .case-stars{font-size:16px;color:var(--gold)}.instructions{padding:13px 15px;border:1px dashed #687e87;border-radius:13px;background:#172b3d;font-size:12px;color:#c0ccd3;line-height:1.65}.rule-bubble{background:#e5d0a0;color:#213441;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:800;margin-top:12px}.challenge{margin-top:12px;border-radius:14px;background:#253e50;border:1px solid #628178;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.challenge b{font-size:13px}.challenge small{font-size:11px;color:#aebcc8}.challenge button{background:#f4d299;color:#26313a;border:0;border-radius:10px;padding:10px 13px;font-weight:800;white-space:nowrap}.level-bubble{position:absolute;right:16px;top:16px;font-size:30px;opacity:.55;transform:rotate(-10deg)}.quiet{opacity:.8}.wrong{animation:shake .25s ease}@keyframes shake{20%{transform:translateX(-2px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}.pulse{animation:ring 1.3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}@keyframes ring{50%{opacity:.28;transform:scale(1.38)}}.found-ring{stroke-dasharray:4 6;animation:spin 10s linear infinite;transform-origin:center;transform-box:fill-box}@keyframes spin{to{transform:rotate(360deg)}}.confetti{pointer-events:none;position:fixed;z-index:88;top:-5vh;width:7px;height:13px;animation:fall 1.7s ease-in forwards}@keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:0}}.spot-pop{animation:spotpop .25s ease-out}@keyframes spotpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    @media(min-width:700px){#app{padding-top:28px}.painting-area{padding:13px}.paint-cap{margin-top:22px}.brief{padding:22px}.stats{margin:17px 0}.bottom-row{margin-top:19px}}
    @media(max-width:360px){#app{padding-left:10px;padding-right:10px}.brand-text strong{font-size:19px}.brief{padding:15px}.painting-area{padding:6px}.pill-btn{font-size:10px;padding:9px 4px}.brief h1{font-size:23px}.caption-note{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="app">
    <header class="mast">
      <div class="brand"><div class="brand-mark" aria-hidden="true">▣</div><div class="brand-text"><strong>FRAME JOB</strong><small>THE FORGERY BUREAU</small></div></div>
      <div class="mast-actions"><button class="icon-btn" id="soundBtn" aria-label="Toggle sound" title="Sound">♪</button><button class="icon-btn" id="casesBtn" aria-label="Case files" title="Case files">▦</button><button class="icon-btn" id="helpBtn" aria-label="How to play" title="How to play">?</button></div>
    </header>
    <section class="brief" aria-live="polite">
      <div class="overline" id="caseOverline">CASE FILE 01 · THE FORGERY BUREAU</div>
      <h1 id="caseTitle">The Glasshouse Secret</h1><p id="caseDesc">The museum has two copies. Only one tells the truth.</p>
      <div class="brief-bottom"><div class="track" aria-label="Clue progress"><div id="progressBar"></div></div><span class="count" id="progressText">0 / 5 CLUES</span></div>
    </section>
    <section class="stats"><div class="stat" id="clockBox"><label>TIME LEFT</label><b id="timer">02:00</b></div><div class="stat"><label>CASE SCORE</label><b id="score">0</b></div><div class="stat"><label>HINTS LEFT</label><b id="hints">2 <small>FREE</small></b></div></section>
    <div class="painting-area"><div class="paint-inner"><div class="painting" id="painting" aria-label="Forgery painting: tap altered details"><div class="art-layer suspect" id="suspect"></div><div class="art-layer original" id="original"></div><svg class="mark-layer" id="marks" viewBox="0 0 600 420" aria-hidden="true"></svg></div></div></div>
    <div class="paint-cap"><span class="canvas-label" id="canvasLabel">SUSPECT CANVAS</span><span class="caption-note" id="canvasNote">Tap suspicious details to tag evidence</span></div>
    <div class="compare"><button id="fakeBtn" class="pill-btn active">◆ FORGERY</button><button id="originalBtn" class="pill-btn">◇ ORIGINAL</button><button id="holdBtn" class="pill-btn soft">◎ HOLD TO PEEK</button></div>
    <div class="bottom-row"><button class="btn btn-primary" id="hintBtn"><span class="icon">✦</span> FREE HINT <span id="hintCount">(2)</span></button><button class="btn btn-outline" id="blinkBtn"><span class="icon">◉</span> BLINK COMPARE</button></div>
    <div class="below"><span>100% ORIGINAL ART</span><span class="dot"></span><span>PLAY OFFLINE</span><span class="dot"></span><span>AUTO-SAVED</span></div>
    <div style="text-align:center"><button class="gallery-link" id="galleryLink">OPEN THE CASE BOARD · DAILY CHALLENGE</button></div>
  </div>
  <div class="toast" id="toast" role="status"></div><div id="modalHost"></div>
  <script>
/* FRAME JOB — all scenes are original code-drawn vector illustrations.
   Each flagged detail has a matching authored evidence hotspot. */
'use strict';
const A={
 rect:(x,y,w,h,fill,rx=0,stroke='none',sw=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`,
 circle:(x,y,r,fill,stroke='none',sw=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`,
 ellipse:(x,y,rx,ry,fill,stroke='none',sw=1)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`,
 path:(d,fill='none',stroke='none',sw=1)=>`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`,
 line:(x1,y1,x2,y2,stroke,sw=2)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round"/>`,
 text:(x,y,t,sz,fill,weight=700)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Georgia,serif" font-weight="${weight}" font-size="${sz}" fill="${fill}">${t}</text>`,
 star:(x,y,r,fill,n=5)=>{let p=[];for(let i=0;i<n*2;i++){let a=i*Math.PI/n-Math.PI/2,rr=i%2?r*.42:r;p.push(`${(x+Math.cos(a)*rr).toFixed(1)},${(y+Math.sin(a)*rr).toFixed(1)}`)}return `<polygon points="${p.join(' ')}" fill="${fill}"/>`},
 leaves:(x,y,col)=>`<g fill="${col}"><ellipse cx="${x-9}" cy="${y-9}" rx="15" ry="7" transform="rotate(-38 ${x-9} ${y-9})"/><ellipse cx="${x+11}" cy="${y-21}" rx="17" ry="8" transform="rotate(38 ${x+11} ${y-21})"/></g>`,
 flower:(x,y,col='#f5a4a2',radius=14,n=5)=>{let p='';for(let i=0;i<n;i++){let a=(Math.PI*2*i/n)-Math.PI/2;p+=A.ellipse(x+Math.cos(a)*radius*.84,y+Math.sin(a)*radius*.84,radius*.62,radius*.62,col)}return p+A.circle(x,y,radius*.45,'#f5d576')},
 waves:(y,col='#f5d398',count=6)=>Array.from({length:count},(_,i)=>A.path(`M${-25+i*120} ${y+(i%2)*8}q25 -9 52 0t52 0`,'none',col,2)).join('')
};
const svg=(content,theme='night')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Original illustrated painting" preserveAspectRatio="xMidYMid meet"><defs>
 <linearGradient id="nightsky" x2=".1" y2="1"><stop stop-color="#172843"/><stop offset=".56" stop-color="#42637a"/><stop offset="1" stop-color="#d49887"/></linearGradient>
 <linearGradient id="seasky" x2="0" y2="1"><stop stop-color="#172f57"/><stop offset=".58" stop-color="#a46480"/><stop offset="1" stop-color="#f6bd86"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#2c6f83"/><stop offset="1" stop-color="#173b60"/></linearGradient>
 <linearGradient id="glass" x2=".2" y2="1"><stop stop-color="#60b7c6"/><stop offset="1" stop-color="#1d5b6a"/></linearGradient>
 <linearGradient id="copper" x2="0" y2="1"><stop stop-color="#f9c77c"/><stop offset="1" stop-color="#ad5d49"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#4b538d"/><stop offset="1" stop-color="#bd7190"/></linearGradient>
 <linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#93c696"/><stop offset="1" stop-color="#315d5d"/></linearGradient>
 <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r=".8" fill="#ffe6b2" opacity=".17"/><circle cx="21" cy="22" r="1" fill="#142039" opacity=".25"/><circle cx="27" cy="5" r=".65" fill="#e8e3d2" opacity=".3"/></pattern>
 </defs><g stroke-linejoin="round" stroke-linecap="round">${content}</g>${A.rect(0,0,600,420,'url(#grain)')}</svg>`;

const greenhouse=(fake)=>{
 let s=A.rect(0,0,600,420,'#254653')+A.rect(0,0,600,305,'url(#nightsky)');
 // Architectural stained-glass greenhouse roof
 s+=A.path('M25 262V131L298 18L573 131V262','#263f4c','#e2ae70',11)+A.path('M40 248V141L299 31L559 141V248','#315f68','#a9855c',5);
 s+=A.path('M61 230V155L297 57L538 155V230','#305867','#b49769',3);
 s+=A.line(300,34,300,269,'#d8ab72',9)+A.line(52,199,545,199,'#d7a773',8)+A.line(102,124,102,257,'#c39b68',5)+A.line(496,124,496,257,'#c39b68',5)+A.line(195,87,195,252,'#c29b64',5)+A.line(400,88,400,251,'#c39b68',5);
 s+=A.circle(508,81,35,'#f6dfaa');if(fake){s+=A.circle(520,71,30,'#3b5970')}else{s+=A.circle(498,73,3,'#ceb97e')+A.circle(519,91,4,'#ceb97e')}
 for(const [x,y,r] of [[130,64,2],[172,96,3],[368,61,2],[455,119,2],[84,180,2],[532,180,2]])s+=A.star(x,y,r,'#efdfb4',4);
 // Window round seal
 s+=A.circle(298,145,34,'#163e4d','#e7bc7a',6)+A.circle(298,145,26,'#71b9ab','#d5c48b',2);
 for(let i=0;i<8;i++){let a=i*Math.PI/4;s+=A.line(298+Math.sin(a)*6,145+Math.cos(a)*6,298+Math.sin(a)*23,145+Math.cos(a)*23,'#d6e5b2',3)}
 s+=A.circle(298,145,9,fake?'#eaa1a9':'#e5ca67','#f5edc9',2);
 // flooring and planters
 s+=A.rect(0,263,600,157,'#bb8e69')+A.path('M0 278Q290 252 600 285V420H0Z','#97765f');
 for(let y of [302,347,390])s+=A.line(0,y,600,y,'#dfba86',2);
 s+=A.rect(20,273,558,15,'#e1b778',4)+A.rect(34,287,16,113,'#754d42')+A.rect(550,287,16,113,'#754d42');
 // tall left plants
 s+=A.line(98,319,92,181,'#355c47',7)+A.line(98,278,68,236,'#355c47',5)+A.line(98,261,131,209,'#355c47',5);
 for(let [x,y] of [[87,223],[111,203],[67,237],[127,231],[89,190],[105,259]])s+=A.ellipse(x,y,21,10,'#5e957b','#2b5961',2);
 s+=A.path('M61 326L139 326L126 390L75 390Z','#bb684f','#513f40',4)+A.ellipse(100,326,39,9,'#e5a474');
 // main featured flower
 s+=A.line(169,329,169,241,'#315e49',6)+A.leaves(168,304,'#619b6d');s+=A.flower(170,252,fake?'#e9db74':'#f5a1a8',18,6);
 s+=A.path('M142 331L201 331L191 376L151 376Z','#557e82','#d9c293',4)+A.ellipse(171,331,30,8,'#83a49a');
 // butterfly on right middle
 if(fake){s+=A.ellipse(393,191,12,8,'#f3bd8c')+A.line(391,188,399,193,'#e9d0b0',2)}else{
 s+=A.ellipse(384,181,19,12,'#efb7a2','#593f61',2)+A.ellipse(414,181,19,12,'#edb48e','#593f61',2)+A.ellipse(388,203,13,10,'#d98a85','#593f61',2)+A.ellipse(410,203,13,10,'#db8f80','#593f61',2)+A.line(399,173,399,210,'#352e51',5)+A.line(397,175,389,165,'#352e51',2)+A.line(401,175,408,164,'#352e51',2)
 }
 // right leafy plants with altered planter
 s+=A.line(470,330,458,208,'#467658',7)+A.line(469,272,497,229,'#467658',5);

    if(x<0||x>600||y<0||y>420)return;const spots=cases[idx].spots;

    const prev=save.best[cases[idx].id]||{stars:0,score:0};save.best[cases[idx].id]={stars:Math.max(stars,prev.stars),score:Math.max(finalScore,prev.score)};save.unlocked=Math.max(save.unlocked,Math.min(cases.length-1,idx+1));save.solved++;

    persist();audio('win');for(let j=0;j<36;j++){let el=document.createElement('div');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=['#f0d18b','#9ed9c0','#ef9f9f','#acc4f0'][j%4];el.style.animationDelay=(Math.random()*.4)+'s';el.style.transform=`rotate(${j*29}deg)`;document.body.appendChild(el);setTimeout(()=>el.remove(),2700)}
